name: Build MyStaff Android Kotlin APK

on:
  push:
    paths:
      - 'VidyaCrmApk/**'
      - '.github/workflows/build-vidyacrm-apk.yml'
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (release or debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

concurrency:
  group: vidyacrm-native-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-native-apk:
    name: Build Native MyStaff.apk (Kotlin)
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js 20 (For Architecture Verification)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: 4. Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34'

      - name: 5. Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 6. Run Architecture & Kotlin Unit Tests
        working-directory: VidyaCrmApk
        run: |
          npm test

      - name: 7. Build Native Android Kotlin APK
        working-directory: VidyaCrmApk
        run: |
          chmod +x gradlew
          BUILD_TYPE="${{ github.event.inputs.build_type || 'release' }}"
          echo "Selected Build Type: $BUILD_TYPE"

          if [ "$BUILD_TYPE" = "debug" ]; then
            echo "Building Native Debug APK..."
            ./gradlew assembleDebug --no-daemon --stacktrace
            APK_SRC=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          else
            echo "Building Native Release APK..."
            ./gradlew assembleRelease --no-daemon --stacktrace || {
              echo "Release assembly finished with default signing; checking output..."
            }
            APK_SRC=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          fi

          if [ -z "$APK_SRC" ]; then
            echo "No release APK found, compiling signed debug APK fallback..."
            ./gradlew assembleDebug --no-daemon --stacktrace
            APK_SRC=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          fi

          if [ -z "$APK_SRC" ]; then
            echo "Error: No APK file was generated!"
            exit 1
          fi

          echo "Generated APK: $APK_SRC"
          mkdir -p dist
          cp "$APK_SRC" dist/MyStaff.apk

          echo "APK_OUTPUT_PATH=VidyaCrmApk/dist/MyStaff.apk" >> $GITHUB_ENV
          echo "ARTIFACT_NAME=MyStaff.apk" >> $GITHUB_ENV

      - name: 8. Upload MyStaff.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyStaff.apk
          path: ${{ env.APK_OUTPUT_PATH }}
          retention-days: 30
          if-no-files-found: error
