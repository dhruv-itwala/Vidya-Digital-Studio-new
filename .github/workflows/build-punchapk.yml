name: Build VDS PunchAPK Android

on:
  push:
    paths:
      - 'PunchAPK/**'
      - '.github/workflows/build-punchapk.yml'
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (release or debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

concurrency:
  group: punchapk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'PunchAPK/package.json'

      - name: 3. Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: 4. Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;34.0.0 build-tools;35.0.0 platforms;android-34 platforms;android-35'

      - name: 5. Install PunchAPK Dependencies
        working-directory: PunchAPK
        run: |
          npm install

      - name: 6. Run PunchAPK Unit Tests & Type Check
        working-directory: PunchAPK
        run: |
          npm run typecheck
          npm test

      - name: 7. Run Backend Kiosk Integration Tests
        working-directory: Backend
        run: |
          npm install
          node --test tests/kiosk.test.js

      - name: 8. Generate Android Native Project via Expo Prebuild
        working-directory: PunchAPK
        run: |
          npx expo prebuild --platform android --clean
          echo "android.disableAutomaticComponentCreation=false" >> android/gradle.properties
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL || 'http://backend.vidyadigitalstudio.com/api/v1.0' }}
          EXPO_PUBLIC_DEFAULT_DEVICE_ID: ${{ secrets.KIOSK_DEVICE_ID || 'M32-KIOSK-01' }}

      - name: 9. Setup Release Keystore (If Provided)
        working-directory: PunchAPK/android
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > app/release.keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: 10. Build Android APK via Gradle
        working-directory: PunchAPK/android
        run: |
          chmod +x gradlew
          if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
            echo "Building Standalone Debug APK with embedded bundle..."
            ./gradlew assembleDebug -Preact.bundleInDebug=true --no-daemon --stacktrace
            echo "APK_PATH=PunchAPK/android/app/build/outputs/apk/debug/app-debug.apk" >> $GITHUB_ENV
            echo "ARTIFACT_NAME=vds-punchapk-debug-${{ github.run_number }}.apk" >> $GITHUB_ENV
          else
            echo "Building Standalone Release APK..."
            ./gradlew assembleRelease --no-daemon --stacktrace
            echo "APK_PATH=PunchAPK/android/app/build/outputs/apk/release/app-release.apk" >> $GITHUB_ENV
            echo "ARTIFACT_NAME=vds-punchapk-release-${{ github.run_number }}.apk" >> $GITHUB_ENV
          fi
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL || 'http://backend.vidyadigitalstudio.com/api/v1.0' }}
          EXPO_PUBLIC_DEFAULT_DEVICE_ID: ${{ secrets.KIOSK_DEVICE_ID || 'M32-KIOSK-01' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: 11. Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.APK_PATH }}
          retention-days: 30
          if-no-files-found: error
